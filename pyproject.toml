[project]
name = "windsight"
version = "1.0.0"
description = "Auditable day-ahead wind forecast intelligence"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.vercel]
entrypoint = "app:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"
